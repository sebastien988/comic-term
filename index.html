<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Terminal output is attacker-controlled in the general case (ssh into
     anything, `cat` any file). Deny everything by default and allow only the
     local bundle: no network, no remote scripts, no inline <script>.
     xterm.js injects its own <style> element, hence style 'unsafe-inline'. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' file:;
               style-src 'self' file: 'unsafe-inline';
               img-src 'self' file: data:;
               font-src 'self' file:;
               connect-src 'none';
               object-src 'none';
               base-uri 'none';
               form-action 'none'">
<title>ComicTerm</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabbar">
    <div id="tabstrip" role="tablist" aria-label="Terminal tabs"></div>
    <button id="newtab" type="button" title="New tab (Ctrl+Shift+T)" aria-label="New tab">+</button>
    <div id="fontbox">
      <label class="visually-hidden" for="fontinput">Terminal font</label>
      <input id="fontinput" title="Terminal font — Ctrl +/- to resize" spellcheck="false" autocomplete="off">
    </div>
  </div>
  <div id="panes"></div>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
