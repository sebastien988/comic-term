name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm test
